<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>{{title}}</title>
<!--
  A notification's e-mail as HTML (lib/common/notifications.php
  notificationEmailText sends it with its plain text), in the password reset
  e-mail's design: the logo, a dark card, a white button. Tables, inline
  styles and explicit colours, as mail apps read best. Everything filled in
  is escaped first; the quote is left out when there's nothing to quote.
-->
</head>
<body style="margin:0;padding:0;background-color:#0f0f10;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f0f10" style="background-color:#0f0f10;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding:0 0 24px;">
            <a href="{{siteBaseURL}}" style="text-decoration:none;color:#ffffff;">
              <img src="{{siteBaseURL}}/images/zmaps_white.png" width="160" height="62" alt="Zelda Maps" style="display:block;border:0;width:160px;height:auto;color:#ffffff;font-family:Georgia,serif;font-size:24px;">
            </a>
          </td>
        </tr>
        <tr>
          <td bgcolor="#1c1c1f" style="background-color:#1c1c1f;border:1px solid #333336;border-radius:22px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#ffffff;">
            <h1 style="margin:0 0 20px;font-size:21px;line-height:1.35;font-weight:700;color:#ffffff;">{{title}}</h1>
            {{quote}}
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="left" style="padding:4px 0 0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="center" bgcolor="#ffffff" style="background-color:#ffffff;border-radius:10px;">
                        <a href="{{url}}" style="display:inline-block;padding:14px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;line-height:1;color:#111113;text-decoration:none;border-radius:10px;">{{button}}</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 12px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#77777c;">
            You’re getting this because of your notification settings.<br>
            <a href="{{settingsURL}}" style="color:#a8a8ad;text-decoration:underline;">Choose which emails you get</a>
            &nbsp;·&nbsp;
            <a href="{{siteBaseURL}}" style="color:#a8a8ad;text-decoration:none;">zeldamaps.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
