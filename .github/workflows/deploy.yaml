name: Deployment script
on:
  push:
    branches:
      - staging
      - production
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Pull latest code to cPanel
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Execute SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            set -e
            echo "DEPLOY_VERIFY_START"
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin ${{ github.ref_name }}
            git switch ${{ github.ref_name }}
            git pull --ff-only origin ${{ github.ref_name }}
            php bin/migrate.php
            echo "DEPLOY_BRANCH=$(git branch --show-current)"
            echo "DEPLOY_COMMIT=$(git rev-parse HEAD)"
            test "$(git branch --show-current)" = "${{ github.ref_name }}"
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            echo "DEPLOY_VERIFY_COMPLETE"
