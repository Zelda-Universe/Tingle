<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Default Zelda Maps profile picture</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc46f"/>
      <stop offset="1" stop-color="#2b7a3d"/>
    </linearGradient>
    <clipPath id="badge">
      <circle cx="64" cy="64" r="64"/>
    </clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="128" height="128" fill="url(#background)"/>
    <!-- Shoulders -->
    <path d="M20 128c2-28 19-45 44-45s42 17 44 45z" fill="#fff"/>
    <!-- Head -->
    <circle cx="57" cy="62" r="19" fill="#fff"/>
    <!-- Stocking cap: a tall crown with a long tail that droops down behind
         the head. The outline sets it apart from the head. -->
    <path d="M37 58C35 42 45 31 59 31c21 0 39 20 48 53-9-11-18-20-30-27z"
          fill="#fff" stroke="#3a9a4d" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
